<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckDB WASM • Data Explorer</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <header class="sidebar-header">
            <h1>Data Explorer</h1>
            <p class="subtitle">DuckDB + WASM</p>
        </header>

        <section class="filters">
            <h2>Filters</h2>

            <date-range-slider></date-range-slider>

            <multi-select-dropdown></multi-select-dropdown>

            <div class="filter-group">
                <label for="page-size">Rows per Page</label>
                <select id="page-size">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
        </section>

        <section class="stats">
            <h2>Summary</h2>
            <div class="stat-cards">
                <stat-card-records></stat-card-records>
                <stat-card-days></stat-card-days>
            </div>
        </section>
    </aside>

    <main class="main-content">
        <section class="chart-section">
            <chart-section></chart-section>
        </section>

        <section class="table-section">
            <data-table></data-table>
        </section>
    </main>
</div>

<script type="module" src="./src/index.js"></script>
</body>
</html>
